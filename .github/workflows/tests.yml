name: tests

on:
  push:
  pull_request:

jobs:
  pynformatics-unit:
    # Разрешаем только push (ветки пушат лишь люди с write-доступом) и PR из веток
    # этого же репозитория. PR из форков пропускаем — их код не должен исполняться
    # на self-hosted раннере. Условие вычисляется до отправки job на раннер.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pynformatics unit tests
        # Точечно: legacy pynformatics/tests.py читает захардкоженный путь и не годится для CI
        run: python -m unittest pynformatics.view.test_problem -v
