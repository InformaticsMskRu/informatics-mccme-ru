name: tests

on:
  push:
  pull_request:

jobs:
  pynformatics-unit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pynformatics unit tests
        # Точечно: legacy pynformatics/tests.py читает захардкоженный путь и не годится для CI
        run: python -m unittest pynformatics.view.test_problem -v
