name: tests

on:
  push:
  pull_request:

jobs:
  pynformatics-unit:
    # Разрешаем только push (ветки пушат лишь люди с write-доступом) и PR из веток
    # этого же репозитория. PR из форков пропускаем — их код не должен исполняться
    # на self-hosted раннере. Условие вычисляется до отправки job на раннер.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    # Гоняем в контейнере с Python 3.8 (как в проде, Dockerfile = ubuntu:focal),
    # не завися от версии Python на хосте раннера. Требует Docker на раннере.
    container:
      image: python:3.8-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pynformatics unit tests
        # Точечно: legacy pynformatics/tests.py читает захардкоженный путь и не годится для CI
        run: python -m unittest pynformatics.view.test_problem -v
